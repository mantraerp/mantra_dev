user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	server_names_hash_bucket_size 64;
	client_max_body_size 500M;
	proxy_max_temp_file_size 0;
	sendfile        on;
    keepalive_timeout  40;
	keepalive_requests      10;
	tcp_nopush      on;
	tcp_nodelay     on; 
	client_header_timeout   181s;
	client_body_timeout     181s;
	send_timeout            181s;
	proxy_connect_timeout   181;
	proxy_send_timeout      181;
	proxy_read_timeout      181;
	gzip    off;
	gzip_comp_level 6;
	gzip_vary off;
	#gzip_proxied no-cache no-store private expired auth;
	gzip_types text/plain text/css application/json application/x-javascript application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/x-icon ;
	##
	# Basic Settings
	##

	#sendfile on;
	#tcp_nopush on;
	#types_hash_max_size 2048;
	server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	#include /etc/nginx/mime.types;
	#default_type application/octet-stream;

	##
	# SSL Settings
	##

	# ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_protocols TLSv1.3; # Dropping SSLv3, ref: POODLE

	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	#gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
	
	upstream mantra_nodes{
		least_conn;
		server 127.0.0.1:8001;
	}

	server{
		listen 443 ssl;
		# ssl_certificate /home/mantra/Documents/Certificate/new_certificate/fullchain.crt;
		# ssl_certificate_key /home/mantra/Documents/Certificate/new_certificate/star.milaap.ai.key.no_passphrase;
		ssl_certificate /home/mantra/Documents/Certificate2/new_certificate.crt;
		ssl_certificate_key /home/mantra/Documents/Certificate2/star.milaap.ai.no_passphrase.key;
		server_name mantratec.milaap.ai;		
		
		add_header X-Frame-Options "DENY" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
		proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";

		# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
		add_header Content-Security-Policy "frame-ancestors 'none';" always;
		# add_header Content-Security-Policy "default-src 'self'; font-src *;img-src * data:; script-src *; style-src *;" always;

		add_header X-XSS-Protection "1; mode=block" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin" always;
		add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()" always;

		location / {
			proxy_pass http://mantra_nodes;
		}
		location /_test {
			try_files $uri $uri/ =404;
			autoindex off;
		}
	}
	
